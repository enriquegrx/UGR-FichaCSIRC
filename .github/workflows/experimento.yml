name: Version candidata

# SOLO para las ramas de prueba (experimento/... y mejoras/...): construye lo MISMO que
# publicaria release.yml (instalador de Windows y .dmg de macOS) y lo deja como
# ARTEFACTO descargable en la pagina del run (Actions > run > Artifacts).
# No crea release ni etiqueta: no llega a nadie y el actualizador no lo ve.
# Sirve para instalarlo a mano y probar la experiencia real antes de publicar.

on:
  push:
    branches: ["experimento/**", "mejoras/**"]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la compilacion anterior: aqui solo
# interesa la ultima (al reves que en release.yml, que no debe cancelar nada).
concurrency:
  group: experimento-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-web.txt pyinstaller==6.21.0

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -t . -v

      # Mismas opciones que release.yml (ver alli el porque de --onedir).
      - name: Construir FichaCSIRC (carpeta)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name "FichaCSIRC" --icon "fichacsirc.ico"
          --version-file "version_info.txt"
          --add-data "web;web" --add-data "logo_ugr.png;." --add-data "fichacsirc.ico;."
          --add-data "NOVEDADES.md;." --add-data "TECNOLOGIA.md;."
          --hidden-import pystray._win32
          registrar_web.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      # La version del instalador sale del codigo, con "-candidata" para que
      # se vea en "Aplicaciones instaladas" que no es una version publicada.
      - name: Construir instalador
        shell: pwsh
        run: |
          $v = (Select-String -Path rellenar_horas.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          # VersionInfoVersion solo admite numeros: va aparte (ver instalador.iss)
          iscc /DMyAppVersion="$v-candidata" /DMyAppVersionNum="$v" instalador.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FichaCSIRC-Instalador-candidata
          path: dist/FichaCSIRC-Instalador.exe
          retention-days: 30

  # Linux: .deb (Ubuntu/Debian) y AppImage, sin PyInstaller (ver build_linux.sh).
  # Se construye en la Ubuntu mas antigua soportada (22.04, Python 3.10) y se
  # PRUEBA que arranca en una pantalla virtual (xvfb) antes de publicar.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema (WebKitGTK, pantalla virtual)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pip python3-gi gir1.2-webkit2-4.1 xvfb dpkg-dev

      - name: Construir .deb y AppImage
        run: bash build_linux.sh

      - name: El codigo compila con el Python de Ubuntu 22.04 (3.10)
        run: python3 -m compileall -q build/linux/app

      # 124 = timeout lo corto con la ventana abierta (el asistente, sin config):
      # arranco bien. Cualquier otro codigo es que se cerro solo.
      # El sandbox de WebKit no funciona en los runners de GitHub (solo aqui).
      - name: Probar que arranca (.deb)
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          FICHACSIRC_CONFIG: /tmp/fichacsirc-deb/config.json
        run: |
          sudo apt-get install -y -q ./dist/fichacsirc_*_all.deb
          set +e; xvfb-run -a timeout 25 fichacsirc; rc=$?; set -e
          echo "codigo: $rc"; test "$rc" = 124

      - name: Probar que arranca (AppImage)
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          FICHACSIRC_CONFIG: /tmp/fichacsirc-appimage/config.json
        run: |
          set +e; xvfb-run -a timeout 25 ./dist/FichaCSIRC-linux-x86_64.AppImage; rc=$?; set -e
          echo "codigo: $rc"; test "$rc" = 124

      - uses: actions/upload-artifact@v4
        with:
          name: FichaCSIRC-linux-candidata
          path: |
            dist/fichacsirc_*_all.deb
            dist/FichaCSIRC-linux-x86_64.AppImage
          retention-days: 30

  # La otra Ubuntu de los usuarios (24.04, Python 3.12): instala el .deb
  # construido arriba y comprueba que arranca.
  linux-2404:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FichaCSIRC-linux-candidata
          path: dist
      - name: Instalar el .deb y probar que arranca
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          FICHACSIRC_CONFIG: /tmp/fichacsirc-2404/config.json
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ./dist/fichacsirc_*_all.deb
          set +e; xvfb-run -a timeout 25 fichacsirc; rc=$?; set -e
          echo "codigo: $rc"; test "$rc" = 124

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin tests en macOS a proposito: ya corren en el job de Windows (ver
      # release.yml). build_macos.sh instala sus dependencias en un venv.
      - name: Construir app y .dmg
        run: ARCH_LABEL=${{ matrix.arch }} ./build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FichaCSIRC-mac-${{ matrix.arch }}-candidata
          path: dist/FichaCSIRC-mac-${{ matrix.arch }}.dmg
          retention-days: 30
