name: Version Rust (en pruebas)

# SOLO la rama de la version Rust/Tauri (rust/...): compila sin publicar nada.
# Pasa los tests de Rust y deja los instaladores como ARTEFACTO descargable
# en la pagina del run (Actions > run > Artifacts). No crea release ni
# etiqueta: no llega a nadie y el actualizador de la app no lo ve.

on:
  push:
    branches: ["rust/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows
            os: windows-latest
            paquetes: nsis
            salida: tauri/target/release/bundle/nsis/*.exe
          - nombre: mac-arm64
            os: macos-26
            paquetes: dmg
            salida: tauri/target/release/bundle/dmg/*.dmg
          - nombre: mac-x64
            os: macos-26-intel
            paquetes: dmg
            salida: tauri/target/release/bundle/dmg/*.dmg
          - nombre: linux
            os: ubuntu-22.04
            paquetes: deb,appimage
            salida: |
              tauri/target/release/bundle/deb/*.deb
              tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Librerias de Linux (WebKitGTK y bandeja)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tests de Rust
        working-directory: tauri
        run: cargo test

      - name: Compilar e instalador
        working-directory: tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.paquetes }}

      - uses: actions/upload-artifact@v5
        with:
          name: FichaCSIRC-rust-${{ matrix.nombre }}
          path: ${{ matrix.salida }}
          if-no-files-found: error
