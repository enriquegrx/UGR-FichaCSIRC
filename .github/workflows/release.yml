name: Release

# Se dispara al subir una etiqueta de version (ej. v2.1):
#   git tag v2.1 && git push origin v2.1
# Construye los .exe y los publica como Release de GitHub.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Una release a la vez. GitHub solo da unos pocos runners de macOS a la cuenta,
# asi que si se etiquetan varias versiones seguidas y un job de macOS se cuelga,
# ocupa su sitio hasta el corte duro de las 6 horas y las releases siguientes se
# quedan en "queued" sin arrancar nunca (paso de verdad: 6 runs abiertos, 4 jobs
# de Intel colgados y las apps de macOS de 2.9.0 y 2.9.1 sin publicarse).
# Con esto los runs se ponen en fila en vez de pelearse por los runners, y
# cancel-in-progress a false para no dejar una release a medias.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    # Si algo se cuelga, que muera solo: una release a medias es mejor que
    # un run abierto 6 horas bloqueando la vista de Actions.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        # PyInstaller fijado: evita que un bootloader nuevo cambie el manejo del
        # empaquetado sin avisar (build reproducible).
        run: pip install -r requirements-web.txt pyinstaller==6.21.0

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -t . -v

      # Desde la 3.0 hay UNA app: la interfaz HTML (registrar_web.py + web/,
      # con pywebview); el asistente de configuracion va dentro (--configurar).
      # Modo CARPETA (--onedir), no --onefile: el .exe se ejecuta junto a su
      # carpeta _internal (con python3XX.dll y el runtime VC) y NO se extrae nada
      # a %TEMP%\_MEI. Asi se evita el error "Failed to load Python DLL" al lanzar
      # el .exe recien instalado desde el instalador. --noupx como blindaje extra.
      - name: Construir FichaCSIRC (carpeta)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name "FichaCSIRC" --icon "fichacsirc.ico"
          --version-file "version_info.txt"
          --add-data "web;web" --add-data "logo_ugr.png;." --add-data "fichacsirc.ico;."
          --add-data "NOVEDADES.md;." --add-data "TECNOLOGIA.md;."
          --hidden-import pystray._win32
          registrar_web.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construir instalador único
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          iscc /DMyAppVersion=$v instalador.iss

      # Con --onedir ya no hay .exe suelto portable (el exe necesita su carpeta
      # _internal al lado). Se publica solo el instalador, que empaqueta ambas
      # carpetas; es tambien lo que descarga el autoactualizador.
      - name: Publicar release con el instalador
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FichaCSIRC-Instalador.exe
          generate_release_notes: true

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      # Aqui NO se ejecutan los tests a proposito. Colgaban el job de Intel
      # indefinidamente (19+ min en el paso "Ejecutar tests", cuando el build
      # entero tarda 1 min): los tests de GUI abren ventanas Tk y en ese runner
      # se quedan esperando en vez de saltarse. Ademas son redundantes: ya corren
      # en el workflow de Tests en cada push y en el job de Windows de cada
      # release. Estos jobs solo tienen que EMPAQUETAR.

      - name: Construir apps macOS
        run: ARCH_LABEL=${{ matrix.arch }} ./build_macos.sh

      - name: Publicar release con apps macOS
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FichaCSIRC-mac-${{ matrix.arch }}.dmg
