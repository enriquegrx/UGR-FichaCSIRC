name: Release

# Se dispara al subir una etiqueta de version:
#   git tag v4.0.0 && git push origin v4.0.0
#
# Desde la 4.0 publica la version Rust/Tauri (carpeta tauri/) compilada en modo
# PRODUCCION (--features produccion y SIN tauri.pruebas.json): es FichaCSIRC de
# verdad, la que sustituye a la 3.x al instalarse y usa su misma configuracion.
#
# Una etiqueta con guion (v4.0.0-rc.1) se publica como PRE-RELEASE: las apps
# instaladas no la ven (miran "releases/latest", que excluye las pre-releases,
# y la 3.x ni siquiera entiende ese numero); solo la instala quien tenga el
# enlace. Sirve para ensayar el paso de la 3.x a la 4.x antes de que le llegue
# a nadie.
#
# Los ficheros llevan los nombres que busca el actualizador de la 3.x y de la
# 4.x: FichaCSIRC-Instalador.exe y FichaCSIRC-mac-<arch>.dmg.
#
# La 3.x se publicaba desde este mismo fichero con PyInstaller + Inno Setup. Al
# etiquetar se usa el release.yml del commit etiquetado: una 3.x nueva se
# etiqueta desde una rama que conserve aquel (main, mientras no se le haga
# merge de la 4.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Una release a la vez. GitHub solo da unos pocos runners de macOS a la cuenta,
# asi que si se etiquetan varias versiones seguidas y un job de macOS se cuelga,
# ocupa su sitio hasta el corte duro de las 6 horas y las releases siguientes se
# quedan en "queued" sin arrancar nunca (paso de verdad: 6 runs abiertos, 4 jobs
# de Intel colgados y las apps de macOS de 2.9.0 y 2.9.1 sin publicarse).
# Con esto los runs se ponen en fila en vez de pelearse por los runners, y
# cancel-in-progress a false para no dejar una release a medias.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # La etiqueta tiene que ser la version que lleva el codigo (la que ensena la
  # app y con la que se compara al buscar actualizaciones), y de la 4 en adelante.
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: La etiqueta es la version del codigo
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          conf=$(python3 -c "import json; print(json.load(open('tauri/tauri.conf.json'))['version'])")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' tauri/Cargo.toml | head -1)
          echo "etiqueta=$etiqueta tauri.conf.json=$conf Cargo.toml=$cargo"
          case "$etiqueta" in
            [0-3].*)
              echo "::error::Este release.yml publica la 4.x (Rust). Una 3.x se etiqueta desde una rama con el release.yml de la 3.x."
              exit 1 ;;
          esac
          if [ "$etiqueta" != "$conf" ] || [ "$etiqueta" != "$cargo" ]; then
            echo "::error::La etiqueta v$etiqueta no coincide con la version de tauri/ (tauri.conf.json: $conf, Cargo.toml: $cargo)."
            exit 1
          fi

  # La ventana (web/) es la misma que probaban las releases de la 3.x: sus
  # pruebas, con las de navegador, antes de publicar nada.
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-web.txt

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -t . -v

  publicar:
    needs: [comprobar, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows
            os: windows-latest
            paquetes: nsis
          - nombre: mac-arm64
            os: macos-26
            paquetes: dmg
            arch: arm64
          - nombre: mac-x64
            os: macos-26-intel
            paquetes: dmg
            arch: x64
          - nombre: linux
            os: ubuntu-22.04
            paquetes: deb,appimage
    runs-on: ${{ matrix.os }}
    # el Mac Intel de GitHub tarda mucho en compilar Rust la primera vez; si
    # algo se cuelga, que muera solo
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Librerias de Linux (WebKitGTK y bandeja)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tests de Rust
        working-directory: tauri
        run: cargo test

      # PRODUCCION: sin tauri.pruebas.json (el producto es "FichaCSIRC", y el
      # instalador de Windows retira la 3.x: tauri/nsis/hooks.nsh) y con la
      # feature (misma config que la 3.x, mismos nombres, se actualiza sola).
      # Las dos cosas van siempre juntas.
      - name: Compilar e instalador (produccion)
        working-directory: tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.paquetes }} --features produccion

      # Con los nombres que busca el actualizador en cada release.
      - name: Nombres de la release
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.nombre }}" in
            windows)
              cp tauri/target/release/bundle/nsis/*-setup.exe dist/FichaCSIRC-Instalador.exe ;;
            mac-*)
              cp tauri/target/release/bundle/dmg/*.dmg "dist/FichaCSIRC-mac-${{ matrix.arch }}.dmg" ;;
            linux)
              cp tauri/target/release/bundle/deb/*.deb dist/
              cp tauri/target/release/bundle/appimage/*.AppImage dist/FichaCSIRC-linux-x86_64.AppImage ;;
          esac
          ls -l dist

      - name: Publicar en la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # v4.0.0-rc.1, v4.0.0-beta.2...: pre-release (nadie la recibe sola)
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ matrix.nombre == 'windows' }}
