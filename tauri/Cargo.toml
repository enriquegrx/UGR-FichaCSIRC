[package]
name = "fichacsirc"
version = "4.0.0-alpha.1"
edition = "2021"
description = "FichaCSIRC: registro de horas en ProyectosTIC (version Rust/Tauri, en pruebas)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls: sin depender de OpenSSL del sistema (en Windows y Linux, igual)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# PIN: el mismo hash que la app de Python (PBKDF2-SHA256 con sal)
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
