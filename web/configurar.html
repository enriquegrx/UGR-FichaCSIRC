<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FichaCSIRC · configuración</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="asistente">
<header class="cabecera">
  <img id="logo" alt="Universidad de Granada" hidden>
  <span class="sep-logo" aria-hidden="true"></span>
  <div class="marca">
    <svg class="icono-app" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b66c3"/><circle cx="32" cy="32" r="20" fill="#fff"/><path d="M23 33l7 7 13-15" fill="none" stroke="#248a46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="marca-texto">
      <h1>Ficha<b>CSIRC</b></h1>
      <span class="subtitulo">Asistente de configuración</span>
    </div>
  </div>
  <span class="etiqueta-prototipo" hidden>prototipo</span>
</header>

<main>
  <ol id="pasos" class="pasos" aria-label="Pasos"></ol>
  <section id="contenido" class="panel contenido-asistente"></section>
</main>

<footer class="pie pie-asistente">
  <span id="paso-n"></span>
  <span class="crece"></span>
  <button id="b-cancelar">Cancelar</button>
  <button id="b-atras">‹ Atrás</button>
  <button id="b-siguiente" class="primario">Siguiente ›</button>
  <button id="b-finalizar" class="primario" hidden>Finalizar</button>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h3 id="modal-titulo"></h3>
    <p id="modal-texto"></p>
    <div class="modal-botones">
      <button id="modal-no">No</button>
      <button id="modal-si" class="primario">Sí</button>
    </div>
  </div>
</div>

<script src="demo.js"></script>
<script src="comun.js"></script>
<script src="configurar.js"></script>
</body>
</html>
